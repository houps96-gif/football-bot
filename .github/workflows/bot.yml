name: news-bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: news-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Load state
        run: |
          if git ls-remote --exit-code --heads origin bot-state > /dev/null; then
            git fetch --depth=1 origin bot-state
            git show FETCH_HEAD:state.json > data/state.json
          else
            rc=$?
            if [ "$rc" -ne 2 ]; then exit 1; fi
            echo "Ветки bot-state ещё нет — первый запуск"
          fi

      - name: Run bot
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          AUTO_PUBLISH_THRESHOLD: ${{ vars.AUTO_PUBLISH_THRESHOLD }}
          LOOP_INTERVAL_MINUTES: "5"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: python run.py --cycles 2 --every 150

      - name: Save state
        if: always() && hashFiles('data/state.json') != ''
        run: |
          cd "$(mktemp -d)"
          git init -q -b bot-state
          cp "$GITHUB_WORKSPACE/data/state.json" .
          git add state.json
          git -c user.name="news-bot" -c user.email="news-bot@users.noreply.github.com" \
            commit -qm "state $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" bot-state
